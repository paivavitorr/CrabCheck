name: CrabCheck CI / CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check workspace crates
        run: cargo check --workspace

  build-release-apk:
    name: Build Release APK
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.6.3 --locked

      - name: Build Android AAR and Release APK via xtask
        run: cargo run -p xtask -- release-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crabcheck-release-apk
          path: target/dx/crabcheck-app/debug/android/app/app/build/outputs/apk/release/*.apk
          retention-days: 14
