[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/core-ffi",
    "apps/app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
crabcheck-core = { path = "crates/core" }
crabcheck-core-ffi = { path = "crates/core-ffi" }
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uniffi = { version = "0.28" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.10", features = ["v7", "std"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
